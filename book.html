<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a dog boarding stay at MPLS Dog Boarding in Minneapolis.">
    <title>Request a Stay | MPLS Dog Boarding</title>

    <link href="https://fonts.googleapis.com/css?family=Montserrat&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<a href="#flexcontainer" class="skip-link">
    Skip to main content
</a>

<div id="container">

    <header class="top">
        <img src="img/paw.svg"
            alt="MPLS Dog Boarding paw print logo">

        <nav class="menu">
            <a href="home.html">Home</a>
            <a href="services.html">Services</a>
            <a href="home.html#hours">Hours</a>
        </nav>
    </header>

    <main id="flexcontainer">

        <section class="card booking-card">

            <h1 class="title">Request a Stay</h1>

            <p>
                Complete the form below to request boarding
                for your dog. All fields are required.
            </p>

            <form id="bookingForm" novalidate>

                <div class="form-group">
                    <label for="ownerName">Owner Name</label>
                    <input type="text"
                           id="ownerName"
                           name="ownerName"
                           autocomplete="name"
                           required
                           aria-describedby="ownerError">
                    <p class="error-message"
                       id="ownerError"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           required
                           aria-describedby="emailError">
                    <p class="error-message"
                       id="emailError"></p>
                </div>

                <div class="form-group">
                    <label for="dogName">Dog Name</label>
                    <input type="text"
                           id="dogName"
                           name="dogName"
                           required
                           aria-describedby="dogError">
                    <p class="error-message"
                       id="dogError"></p>
                </div>

                <div class="form-group">
                    <label for="dropOff">Drop Off Date</label>
                    <input type="date"
                           id="dropOff"
                           name="dropOff"
                           required
                           aria-describedby="dropError">
                    <p class="error-message"
                       id="dropError"></p>
                </div>

                <div class="form-group">
                    <label for="pickUp">Pick Up Date</label>
                    <input type="date"
                           id="pickUp"
                           name="pickUp"
                           required
                           aria-describedby="pickError">
                    <p class="error-message"
                       id="pickError"></p>
                </div>

                <button type="submit" class="btn">
                    Send Stay Request
                </button>

            </form>

            <!-- Live region exists before submission.
                 Screen readers can announce updates. -->
            <div id="formStatus"
                 role="status"
                 aria-live="polite"
                 aria-atomic="true"></div>

        </section>

    </main>

    <footer class="foot">
        <h2>Contact Us</h2>

        <p>
            Phone:
            <a href="tel:6125550142">612-555-0142</a>
        </p>

        <p>
            Address: 123 Example Street,
            Minneapolis, MN 55401
        </p>

        <p>&copy; 2024 MPLS Dog Boarding</p>
    </footer>

</div>

<script src="booking.js" defer></script>
    

</body>
</html>
